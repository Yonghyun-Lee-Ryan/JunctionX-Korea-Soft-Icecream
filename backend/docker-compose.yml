services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: solar-for-bid-backend:local
    container_name: sfb-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # 🔴 DB는 볼륨 안에. 컨테이너를 지워도 데이터가 남는다
      DATABASE_FILE: /app/data/solar-for-bid.sqlite
      # 🔴 비어 있어도 부팅한다 — 없으면 캐시 응답으로 동작
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      STUDIO_AGENT_ID: ${STUDIO_AGENT_ID:-}
      STUDIO_CONFIG_VERSION: ${STUDIO_CONFIG_VERSION:-}
      STUDIO_BASE_URL: ${STUDIO_BASE_URL:-https://api.upstage.ai}
      STUDIO_POLL_INTERVAL_MS: ${STUDIO_POLL_INTERVAL_MS:-3000}
      STUDIO_POLL_TIMEOUT_MS: ${STUDIO_POLL_TIMEOUT_MS:-300000}
      # 🔴 갈래별 에이전트. 이게 비면 업로드가 전부 E_AGENT_NOT_SET(503)이다.
      #    compose는 .env를 자동으로 읽으므로 backend/.env에 값이 있으면 그대로 전달된다.
      STUDIO_AGENT_BIZ_REG: ${STUDIO_AGENT_BIZ_REG:-}
      STUDIO_AGENT_BIZ_REG_CONFIG: ${STUDIO_AGENT_BIZ_REG_CONFIG:-}
      STUDIO_AGENT_SME_CERT: ${STUDIO_AGENT_SME_CERT:-}
      STUDIO_AGENT_CREDIT_RATING: ${STUDIO_AGENT_CREDIT_RATING:-}
      STUDIO_AGENT_PIA_DESIGNATION: ${STUDIO_AGENT_PIA_DESIGNATION:-}
      STUDIO_AGENT_SW_BUSINESS: ${STUDIO_AGENT_SW_BUSINESS:-}
      STUDIO_AGENT_PERFORMANCE: ${STUDIO_AGENT_PERFORMANCE:-}
      STUDIO_AGENT_FINANCIAL: ${STUDIO_AGENT_FINANCIAL:-}
      STUDIO_AGENT_TECH_STAFF: ${STUDIO_AGENT_TECH_STAFF:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      LIVE_FALLBACK_MS: ${LIVE_FALLBACK_MS:-20000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sfb-data:/app/data

volumes:
  sfb-data:
